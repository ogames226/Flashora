name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"

          VERSION_LINE=$(java -version 2>&1 | head -n 1)
          RAW_VER=$(echo "$VERSION_LINE" | sed -E 's/.*"([0-9]+(\.[0-9]+)*).*".*/\1/')
          MAJOR_VER=$(echo "$RAW_VER" | cut -d'.' -f1)

          if [ "$MAJOR_VER" = "1" ]; then
            MAJOR_VER=$(echo "$RAW_VER" | cut -d'.' -f2)
          fi

          if ! [[ "$MAJOR_VER" =~ ^[0-9]+$ ]] || [ "$MAJOR_VER" -lt 17 ]; then
            echo "Error: Java 17 or newer is required, but detected major version '${MAJOR_VER:-unknown}' ($VERSION_LINE)." >&2
            exit 1
          fi

          echo "Verified Java major version: $MAJOR_VER"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            if [ ! -x "$KEYTOOL_BIN" ]; then
              KEYTOOL_BIN="keytool"
            fi

            "$KEYTOOL_BIN" -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 || {
                echo "Error: Failed to generate temporary ./debug.keystore using keytool." >&2
                exit 1
              }
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore is missing after generation." >&2
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK output
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "Error: Expected debug APK not found at $TARGET_APK" >&2
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files under app/build/outputs/apk:" >&2
              find app/build/outputs/apk -type f -name "*.apk" >&2 || true
            else
              echo "Directory app/build/outputs/apk does not exist." >&2
            fi
            exit 1
          fi
          echo "Verified debug APK exists at $TARGET_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
